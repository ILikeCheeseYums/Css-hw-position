<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      section {
        background: center / cover no-repeat url("me.jpeg");
      }
      p {
        color: white;
      }
    </style>
  </head>

  <body>
    <section style="height: 100vh; position: relative">
      <p style="position: absolute; top: 0; left: 0">Shwetank</p>
      <p
        style="
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
        "
      >
        Shwetank
      </p>
      <p style="position: absolute; top: 0; right: 0">Shwetank</p>
      <p
        style="
          position: absolute;
          top: 50%;
          left: 0;
          transform: translateY(-50%);
        "
      >
        Shwetank
      </p>
      <p
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        "
      >
        Shwetank
      </p>
      <p
        style="
          position: absolute;
          top: 50%;
          right: 0;
          transform: translateY(-50%);
        "
      >
        Shwetank
      </p>
      <p style="position: absolute; bottom: 0; left: 0">Shwetank</p>
      <p
        style="
          position: absolute;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
        "
      >
        Shwetank
      </p>
      <p style="position: absolute; bottom: 0; right: 0">Shwetank</p>
    </section>
  </body>
</html>
